<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pink Pastel Heart Rain</title>
  <style>
    :root{
      --bg1: #ffeef6; /* very pale pink */
      --bg2: #ffd7e8; /* slightly deeper */
    }
    html,body{height:100%;margin:0}
    body{
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow:hidden;
    }

    .sky{
      position:fixed;inset:0;pointer-events:none;overflow:hidden;
    }

    /* WRAPPER: Handles the falling motion (Y-axis).
       This prevents conflict with the sway motion.
    */
    .heart-wrapper {
      position: absolute;
      top: -10vh;
      will-change: transform;
      animation-name: fall;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    /* HEART: Handles the shape and the swaying motion (Rotation + X-axis).
    */
    .heart {
      width: 32px; height: 32px;
      transform: rotate(-45deg);
      background: red; /* overridden by JS */
      opacity: 0.8;
      will-change: transform;
      animation-name: sway;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    /* Pseudo-elements for heart arches */
    .heart::before, .heart::after {
      content: '';
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 50%;
      background: inherit;
    }
    .heart::before { transform: translate(-50%, 0); }
    .heart::after { transform: translate(0, -50%); }

    @keyframes fall {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(120vh) scale(1); opacity: 1; }
    }

    @keyframes sway {
      0% { transform: rotate(-45deg) translateX(0); }
      50% { transform: rotate(-35deg) translateX(25px); }
      100% { transform: rotate(-45deg) translateX(0); }
    }

  </style>
</head>
<body>
  <div class="sky" id="sky"></div>
  

  <script>
    const SPAWN_INTERVAL = 150;     
    const MAX_HEARTS = 300;        
    const SIZE_MIN = 10;           
    const SIZE_MAX = 40;           
    const DURATION_MIN = 3000;     
    const DURATION_MAX = 8000;     
    const HUE_MIN = 330;           
    const HUE_MAX = 355;
    const SAT = 70;                
    const LIG = 75;                

    const sky = document.getElementById('sky');
    let heartsCount = 0;
    let spawner = null; // Variable to hold the interval ID

    function rand(min, max){ return Math.random()*(max-min)+min }

    function pastelPink(){
      const h = Math.round(rand(HUE_MIN, HUE_MAX));
      const s = Math.round(SAT + rand(-10,10));
      const l = Math.round(LIG + rand(-5,5));
      return `hsl(${h}, ${s}%, ${l}%)`;
    }

    function createHeart(){
      if(heartsCount >= MAX_HEARTS) return;
      heartsCount++;

      // 1. Create the Wrapper (falls down)
      const wrapper = document.createElement('div');
      wrapper.className = 'heart-wrapper';
      
      const size = Math.round(rand(SIZE_MIN, SIZE_MAX));
      // Position horizontally
      wrapper.style.left = rand(0, 100) + 'vw';
      
      // 2. Create the Heart (sways inside wrapper)
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.width = size + 'px';
      heart.style.height = size + 'px';
      heart.style.background = pastelPink();

      // Randomize animation speeds
      const fallDuration = Math.round(rand(DURATION_MIN, DURATION_MAX));
      const swayDuration = Math.round(rand(2000, 5000));
      
      wrapper.style.animationDuration = fallDuration + 'ms';
      heart.style.animationDuration = swayDuration + 'ms';

      // Assemble
      wrapper.appendChild(heart);
      sky.appendChild(wrapper);

      wrapper.style.left = Math.random() * 100 + "vw";

      // Cleanup
      setTimeout(() => {
        wrapper.style.transition = 'opacity 0.5s';
        wrapper.style.opacity = '0';
        setTimeout(() => {
          if(wrapper.parentNode) wrapper.remove();
          heartsCount--;
        }, 500);
      }, fallDuration);
    }

    function startRain() {
      if (spawner) clearInterval(spawner);
      spawner = setInterval(() => {
        const burst = Math.random() < 0.3 ? 2 : 1; 
        for(let i=0; i<burst; i++) createHeart();
      }, SPAWN_INTERVAL);
    }

    function stopRain() {
      clearInterval(spawner);
    }

    // Visibility API to save battery
    document.addEventListener('visibilitychange', () => {
      document.hidden ? stopRain() : startRain();
    });

    // Init
    startRain();
    // Seed a few immediately
    for(let i=0; i<10; i++) setTimeout(createHeart, i * 200);

  </script>
</body>

</html>
