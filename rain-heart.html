<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pink Pastel Heart Rain</title>
  <style>
    :root{
      --bg1: #ffeef6; /* very pale pink */
      --bg2: #ffd7e8; /* slightly deeper */
    }
    html,body{height:100%;margin:0}
    body{
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      overflow:hidden;
    }

    /* container covers full viewport and holds hearts */
    .sky{
      position:fixed;inset:0;pointer-events:none;overflow:hidden;
    }

    /* heart base */
    .heart{
      position:absolute;
      width:32px; height:32px;
      transform: rotate(-45deg);
      transform-origin: center;
      top:-12vh; /* start above viewport */
      will-change: transform, opacity;
      opacity:0.95;
      animation-name: fall, sway;
      animation-timing-function: linear, ease-in-out;
      animation-iteration-count: 1, infinite;
      animation-fill-mode: forwards;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.06));
      mix-blend-mode: screen;
    }

    /* fall moves the heart from top to below the viewport */
    @keyframes fall{
      0%{transform: translateY(-24vh) rotate(-45deg) scale(0.9); opacity:0}
      6%{opacity:0.95}
      100%{transform: translateY(120vh) rotate(45deg) scale(1.05); opacity:0.95}
    }

    /* sway gives a side-to-side floating motion */
    @keyframes sway{
      0%{transform: translateX(0) rotate(-45deg)}
      50%{transform: translateX(28px) rotate(-40deg)}
      100%{transform: translateX(-22px) rotate(-50deg)}
    }

  </style>
</head>
<body>
  <div class="sky" id="sky"></div>

  <script>
    // Standalone heart rain (no user interaction required)
    const SPAWN_INTERVAL = 180;      // ms between new hearts
    const MAX_HEARTS = 120;          // maximum simultaneous hearts
    const SIZE_MIN = 14;             // px
    const SIZE_MAX = 52;             // px
    const DURATION_MIN = 4200;       // ms
    const DURATION_MAX = 9800;       // ms
    const HUE_MIN = 320;             // pink range
    const HUE_MAX = 355;
    const SAT = 60;                  // saturation percent
    const LIG = 86;                  // lightness percent (pastel)

    const sky = document.getElementById('sky');
    let heartsCount = 0;

    function rand(min, max){ return Math.random()*(max-min)+min }

    function pastelPink(){
      const h = Math.round(rand(HUE_MIN, HUE_MAX));
      const s = Math.round(SAT + rand(-6,6));
      const l = Math.round(LIG + rand(-5,5));
      return `hsl(${h} ${s}% ${l}%)`;
    }

    function createHeart(){
      if(heartsCount >= MAX_HEARTS) return null;
      heartsCount++;
      const el = document.createElement('div');
      el.className = 'heart';

      const size = Math.round(rand(SIZE_MIN, SIZE_MAX));
      el.style.width = size + 'px';
      el.style.height = size + 'px';

      const color = pastelPink();
      // base square color (rotated) will act as the heart body
      el.style.background = color;

      // position horizontally across the viewport
      el.style.left = rand(2, 96) + 'vw';

      // create two circles to form the top of the heart
      const left = document.createElement('div');
      const right = document.createElement('div');
      [left, right].forEach(c=>{
        c.style.position = 'absolute';
        c.style.width = '100%';
        c.style.height = '100%';
        c.style.borderRadius = '50%';
        c.style.left = '0';
        c.style.top = '0';
        c.style.background = color;
      });
      left.style.transform = 'translate(-50%, -22%)';
      right.style.transform = 'translate(50%, -22%)';
      el.appendChild(left);
      el.appendChild(right);

      // set animation durations (fall,long) and sway duration
      const fallDuration = Math.round(rand(DURATION_MIN, DURATION_MAX));
      const swayDuration = Math.round(rand(2400, 6200));
      el.style.animationDuration = fallDuration + 'ms, ' + swayDuration + 'ms';

      // fade-out cleanup after finish
      const removeAfter = fallDuration + 1200;
      setTimeout(()=>{
        el.style.transition = 'opacity 600ms linear';
        el.style.opacity = 0;
        setTimeout(()=>{
          if(el.parentNode) el.parentNode.removeChild(el);
          heartsCount = Math.max(0, heartsCount-1);
        }, 700);
      }, removeAfter);

      sky.appendChild(el);
      return el;
    }

    // continuous spawning
    const spawner = setInterval(()=>{
      // spawn 1-3 hearts each tick for a fuller rain
      const burst = Math.random() < 0.35 ? 3 : (Math.random() < 0.5 ? 2 : 1);
      for(let i=0;i<burst;i++){
        setTimeout(createHeart, i*90);
      }
    }, SPAWN_INTERVAL);

    // conserve resources when tab not visible
    document.addEventListener('visibilitychange', ()=>{
      if(document.hidden){
        clearInterval(spawner);
      } else {
        // restart interval
        setInterval(()=>{
          const burst = Math.random() < 0.35 ? 3 : (Math.random() < 0.5 ? 2 : 1);
          for(let i=0;i<burst;i++) setTimeout(createHeart, i*90);
        }, SPAWN_INTERVAL);
      }
    });

    // seed some initial hearts so the page isn't empty for a moment
    for(let i=0;i<16;i++) setTimeout(createHeart, i*140);
  </script>
</body>
</html>
